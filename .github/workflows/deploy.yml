name: Deploy Vue to EC2 (Static)
run-name: Deploy branch '${{ inputs.branch }}' to production 🚀

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch yang mau di-naikkan ke production'
        required: true
        default: main

# Token hanya perlu baca repo; cegah penyalahgunaan GITHUB_TOKEN jika ada step yang terkompromi
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env.production
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env.production
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env.production
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env.production
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env.production
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env.production

      - name: Build project
        run: npm run build

      - name: Verify dist
        run: |
          echo "=== Hash file terbaru ==="
          ls dist/assets/

      - name: Clean temp folder on server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            rm -rf /home/${{ secrets.SSH_USER }}/deploy_temp
            mkdir -p /home/${{ secrets.SSH_USER }}/deploy_temp

      - name: Upload build to temp folder
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*" # pakai wildcard, bukan "dist/"
          target: "/home/${{ secrets.SSH_USER }}/deploy_temp"
          strip_components: 1 # strip prefix "dist" dari "dist/index.html" → "index.html"

      - name: Replace web root safely
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "=== Isi deploy_temp ==="
            ls -la /home/${{ secrets.SSH_USER }}/deploy_temp/

            # Pastikan deploy_temp tidak kosong sebelum hapus web root
            if [ -z "$(ls -A /home/${{ secrets.SSH_USER }}/deploy_temp/)" ]; then
              echo "ERROR: deploy_temp kosong, deploy dibatalkan"
              exit 1
            fi

            sudo rm -rf /var/www/html/*
            sudo cp -r /home/${{ secrets.SSH_USER }}/deploy_temp/. /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            sudo systemctl reload nginx

            echo "=== Isi /var/www/html ==="
            ls -la /var/www/html/

            rm -rf /home/${{ secrets.SSH_USER }}/deploy_temp
            echo "=== DEPLOY SELESAI ==="

      - name: Notify via email (Resend)
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          STATUS: ${{ job.status }}
          BRANCH: ${{ inputs.branch }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            SUBJECT="✅ Deploy berhasil: $BRANCH → production"
          else
            SUBJECT="❌ Deploy $STATUS: $BRANCH → production"
          fi
          HTML=$(printf '<p><b>%s</b></p><p>Repo: %s<br>Branch: <b>%s</b> &rarr; production<br>Dipicu oleh: %s</p><p><a href="%s">Lihat run di GitHub Actions</a></p>' \
            "$SUBJECT" "$REPO" "$BRANCH" "$ACTOR" "$RUN_URL")
          jq -n \
            --arg from "Deploy Bot <deploy@shifdlabs.com>" \
            --arg to "$NOTIFY_EMAIL" \
            --arg subject "$SUBJECT" \
            --arg html "$HTML" \
            '{from: $from, to: [$to], subject: $subject, html: $html}' \
            | curl -s --fail-with-body -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -d @-
